<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة النتائج</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ملف التنسيقات الخاص بالمشروع -->
    <link rel="stylesheet" href="css/style.css">

    <!-- ملف JavaScript: defer يجعل التنفيذ بعد قراءة HTML -->
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="page-header py-4">
        <div class="container">
            <h1 class="text-center mb-2">نظام إدارة النتائج</h1>
            <p class="text-center mb-0">إضافة بيانات الطلاب وحساب لجنة الرأفة</p>
        </div>
    </header>

    <main class="container py-4">
        <section class="card app-card mb-4">
            <div class="card-body p-4">
                <h2 class="section-title h4 mb-4">إضافة طالب جديد</h2>

                <form id="studentForm" novalidate>
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="studentName" class="form-label">اسم الطالب</label>
                            <input
                                type="text"
                                class="form-control"
                                id="studentName"
                                placeholder="اكتب اسم الطالب"
                                autocomplete="off"
                            >
                        </div>

                        <div class="col-md-4">
                            <label for="subject1" class="form-label">درجة المادة الأولى</label>
                            <input type="number" class="form-control" id="subject1"
                                   placeholder="من 0 إلى 100" min="0" max="100" step="any">
                        </div>

                        <div class="col-md-4">
                            <label for="subject2" class="form-label">درجة المادة الثانية</label>
                            <input type="number" class="form-control" id="subject2"
                                   placeholder="من 0 إلى 100" min="0" max="100" step="any">
                        </div>

                        <div class="col-md-4">
                            <label for="subject3" class="form-label">درجة المادة الثالثة</label>
                            <input type="number" class="form-control" id="subject3"
                                   placeholder="من 0 إلى 100" min="0" max="100" step="any">
                        </div>

                        <div class="col-12">
                            <label for="attendance" class="form-label">نسبة الحضور</label>
                            <input type="number" class="form-control" id="attendance"
                                   placeholder="من 0 إلى 100" min="0" max="100" step="any">
                        </div>

                        <div class="col-12 d-flex flex-wrap gap-2 mt-4">
                            <button type="button" id="addStudentBtn" class="btn btn-primary">
                                إضافة طالب
                            </button>
                            <button type="button" id="mercyBtn" class="btn btn-success">
                                تفعيل لجنة الرأفة
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <!-- صندوق رسائل الخطأ -->
        <div id="errorBox" class="alert alert-danger d-none" role="alert"
             aria-live="polite"></div>

        <!-- قائمة الطلاب -->
        <section class="card app-card mb-4">
            <div class="card-body p-4">
                <h2 class="section-title h4 mb-3">الطلاب الذين تمت إضافتهم</h2>
                <div id="studentsBox">
                    <p class="empty-message mb-0">لم تتم إضافة أي طالب حتى الآن.</p>
                </div>
            </div>
        </section>

        <!-- التقرير النهائي -->
        <section class="card app-card report-card mb-4">
            <div class="card-body p-4">
                <h2 class="section-title h4 mb-3">التقرير النهائي للجنة الرأفة</h2>
                <div id="reportBox" aria-live="polite">
                    <p class="empty-message mb-0">اضغط على زر تفعيل لجنة الرأفة لعرض التقرير.</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center py-3">
        <small>مشروع JavaScript - نظام إدارة النتائج</small>
    </footer>

    <!-- Bootstrap JavaScript Bundle -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
